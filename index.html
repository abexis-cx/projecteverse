<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>در حال به‌روزرسانی</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at center, #151b2d 0%, #080b14 70%);

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: #ffffff;
        }

        .message {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;

            padding: 30px;

            text-align: center;

            animation: fadeIn 1.2s ease-out;
        }

        .text {
            font-size: clamp(20px, 4vw, 36px);
            font-weight: 600;
            line-height: 1.8;

            color: #ffffff;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.12);
        }

        /* آیکون چرخنده */
        .loader {
            width: 32px;
            height: 32px;

            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #ffffff;

            border-radius: 50%;

            animation: spin 0.9s linear infinite;

            flex-shrink: 0;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* موبایل */
        @media (max-width: 600px) {
            .message {
                gap: 14px;
                padding: 20px;
            }

            .text {
                font-size: 19px;
            }

            .loader {
                width: 24px;
                height: 24px;
                border-width: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="message">

        <!-- آیکون سمت راست -->
        <div class="loader"></div>

        <!-- متن اصلی -->
        <div class="text">
            سایت در حال آپدیت می‌باشد، به زودی برمی‌گردیم
        </div>

        <!-- آیکون سمت چپ -->
        <div class="loader"></div>

    </div>

</body>
</html>
